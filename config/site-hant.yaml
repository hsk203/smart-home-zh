# groups: (可選) 友鏈分組，按配置順序展示；不配置則為平鋪列表
#   - id: 分組標識，供友鏈的 group 引用（唯一）
#   - title: 分組標題
#   - description: (可選) 分組說明
# -----------------------------------------------------------------------------
