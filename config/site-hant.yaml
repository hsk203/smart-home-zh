# =============================================================================
# Default Cover List
# 默認封面列表 - 文章沒有指定封面時將隨機從列表中選擇一張作為封面
# 不設置則使用內置的 21 張默認封面 (/img/cover/1~21.webp)
# =============================================================================
# defaultCoverList:
#   - /img/cover/1.webp
#   - https://example.com/custom-cover.webp


# =============================================================================
# Content Processing Options
# 內容處理選項 - 控制文章渲染和交互行為
# =============================================================================
# 字段說明：
#   addBlankTarget: 外部鏈接在新窗口打開
#   smoothScroll: 啟用平滑滾動動畫
#   addHeadingLevel: 自動為標題添加層級錨點
#   enhanceCodeBlock: 增強代碼塊樣式（行號、語言標籤等）
#   enableCodeCopy: 顯示代碼塊複製按鈕
#   enableCodeFullscreen: 顯示代碼塊全屏按鈕
#   enableLinkEmbed: 啟用鏈接卡片預覽（解析 OG 信息）
#   enableTweetEmbed: 啟用推文嵌入展示
#   enableOGPreview: 啟用 Open Graph 預覽卡片
#   previewCacheTime: 預覽信息緩存時間（天）
#   lazyLoadEmbeds: 延遲加載嵌入內容（提升性能）
#   postCardImagePosition: 文章卡片封面圖位置 (alternating/left/right)
# -----------------------------------------------------------------------------
content:
  addBlankTarget: true # 外部鏈接新窗口打開
  smoothScroll: true # 平滑滾動
  addHeadingLevel: true # 標題錨點
  enhanceCodeBlock: true # 增強代碼塊
  enableCodeCopy: true # 代碼複製按鈕
  enableCodeFullscreen: true # 代碼全屏按鈕
  enableLinkEmbed: true # 鏈接卡片預覽
  enableCodePenEmbed: true # CodePen 嵌入
  enableTweetEmbed: true # 推文嵌入
  enableOGPreview: true # OG 預覽卡片
  previewCacheTime: 30 # 預覽緩存時間(天)
  lazyLoadEmbeds: true # 延遲加載嵌入
  postCardImagePosition: alternating # 文章卡片封面圖位置在首頁的顯示控制 alternating 默認交替顯示 left 封面圖始終在左側 right 封面圖始終在右側
  # Shoka 兼容功能（默認全部啟用，設為 false 可關閉）
  enableShokaContainers: true   # :::提醒塊 ;;;標籤卡 +++摺疊塊
  enableShokaAttrs: true        # [text]{.class} 屬性語法
  enableShokaEffects: true      # ++下劃線++ ==高亮== ~下標~ ^上標^
  enableShokaSpoiler: true      # !!隱藏文字!!
  enableShokaRuby: true         # {文字^注音} 注音標註
  enableShokaHexoTags: true     # {% links %} {% media %} Hexo標籤
  enableMath: true              # $數學公式$ KaTeX渲染
  enableCodeMeta: true          # 代碼塊增強 (title, mark, command)
  enableQuiz: true              # 練習題交互功能
  enableEncryptedBlock: true    # :::encrypted{password="..."} 加密內容塊

# =============================================================================
# Motion
# 動效配置 - 站點默認動效強度與櫻花特效
# =============================================================================
# 字段說明：
#   level: 訪客未手動選擇時的默認動效強度，訪客可在右下角「設置 → 通用 → 動效強度」中覆蓋
#     lively  靈動：頁面入場編排、滾動浮現（含正文）、共享元素過渡、櫻花特效
#     subtle  剋制：保留入場與過渡，正文不做滾動浮現，不播放櫻花特效
#     reduced 減弱：關閉裝飾性動效，只保留必要的交互反饋
#   heroPetals: 頭圖櫻花飄落（僅 lively 檔生效）
#   clickBurst: 點擊按鈕、鏈接等可交互元素時迸出花瓣（僅 lively 檔生效）
# 系統開啟「減少動態效果」(prefers-reduced-motion) 時，始終按 reduced 處理
# -----------------------------------------------------------------------------
motion:
  level: lively
  heroPetals: true
  clickBurst: true

