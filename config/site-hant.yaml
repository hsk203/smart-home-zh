# =============================================================================
# Bangumi (Media Tracking)
# 追番頁面 - 註釋掉整個 bangumi 段即可關閉（頁面 + 導航自動隱藏）
# =============================================================================
# 字段說明：
#   userId: Bangumi 用戶名或數字 ID（必填）
#   label: 導航顯示名稱（可選，默認：追番）
#   icon: 導航圖標，Iconify 格式（可選，默認：ri:bilibili-fill）
# -----------------------------------------------------------------------------
dev:
  localProjectPath: '/Users/yourname/path/to/astro-koharu' # 請修改為你的項目絕對路徑
  contentRelativePath: 'src/content/blog'
  editors:
    - id: vscode
      name: VS Code
      icon: devicon-plain:vscode
      urlTemplate: 'vscode://file/{path}'
    - id: cursor
      name: Cursor
      icon: simple-icons:cursor
      urlTemplate: 'cursor://file/{path}'
    - id: zed
      name: Zed
      icon: simple-icons:zedindustries
      urlTemplate: 'zed://file/{path}'
