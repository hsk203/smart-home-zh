# =============================================================================
# Writing Room
# 寫作室 - 默認關閉，開啟後生成 /editor/ 和 /editor/preview/，並顯示已有導航入口
# 使用本地 CMS 編輯文章時也需要開啟；修改後重啟開發服務器或重新構建
# =============================================================================
editor:
  enabled: false

# =============================================================================
# Colophon (落款)
# 文章落款 - 為文章標註創作方式、閱讀提示等，字典在這裡定義，文章 frontmatter 引用
# =============================================================================
# 用法（文章 frontmatter）：
#   colophon: [ai-cowrite, spoiler]
#   colophon:
#     - ai-cowrite
#     - { id: spoiler, note: 含《我推的孩子》第二季劇透 }   # note：本篇自己的補充說明
#     - { icon: fa6-solid:cat, label: 貓貓審閱過 }          # 一次性標記，不進字典
# 字段說明：
#   groups.<id>.label: 分組名稱（顯示在文末落款）
#   groups.<id>.exclusive: 是否互斥，互斥組一篇文章只能選一個（默認 false）
#   groups.<id>.placement / marks.<id>.placement: 顯示位置，可多選（標記優先，其次分組，默認 [meta, seal]）
#     meta   封面信息行（字數、閱讀時長旁）
#     banner 正文前的提示條
#     seal   文末落款
#     card   文章列表卡片上的小圖標
#   marks.<id>.icon: Iconify 圖標，限 ri / fa6-solid / fa6-regular / gg 四套（見 src/lib/config/icon-sets.ts）
#   marks.<id>.tone: muted（默認）| accent | warn
#   defaults: 默認標記，文章沒有該組的標記時自動補上（每組最多一個）；文章寫 colophon: [] 可不顯示任何標記
# 多語言：在 config/i18n-content.yaml 的 <locale>.colophon 下覆蓋 groups / marks 文案
# 刪除整個 colophon 段落即可關閉此功能
# -----------------------------------------------------------------------------
colophon:
  enabled: true
  defaults: [handwritten] # 沒寫執筆的文章默認顯示「手寫」
  groups:
    authorship:
      label: 執筆
      exclusive: true
      placement: [meta, seal, card]
    notice:
      label: 閱讀提示
      placement: [meta, banner]
    # ai:
    #   label: AI 參與
    #   placement: [seal]
    # art:
    #   label: 圖像
    #   placement: [seal]
    # status:
    #   label: 文章狀態
    #   placement: [meta, seal]
    # mood:
    #   label: 寫作時
    #   placement: [seal]
  marks:
    handwritten:
      group: authorship
      icon: ri:quill-pen-line
      label: 手寫
      description: 每個字都是我自己敲的。
    ai-cowrite:
      group: authorship
      icon: ri:sparkling-2-line
      label: 與 AI 合寫
      description: 我主筆，AI 幫我理思路、換說法。
    ai-lead:
      group: authorship
      icon: ri:sparkling-2-fill
      label: AI 主筆
      description: 正文主要由 AI 起草，我負責挑選和改寫。
    spoiler:
      group: notice
      icon: ri:eye-off-line
      label: 含劇透
      description: 涉及作品後續劇情，還沒看完的話可以先收藏。
      tone: warn
    outdated:
      group: notice
      icon: ri:hourglass-line
      label: 可能已過時
      description: 寫得比較早，文中的版本和做法可能已經變了。
      tone: warn
    # ai-idea: { group: ai, icon: ri:lightbulb-flash-line, label: 構思, description: 和 AI 聊過選題與結構。 }
    # ai-polish: { group: ai, icon: ri:magic-line, label: 潤色, description: AI 幫忙改過措辭和錯字。 }
    # ai-code: { group: ai, icon: ri:code-s-slash-line, label: 代碼, description: 示例代碼有 AI 參與編寫。 }
    # ai-translate: { group: ai, icon: ri:translate-2, label: 翻譯, description: 譯文由 AI 初譯，我校對過。 }
    # self-drawn: { group: art, icon: ri:brush-line, label: 自己畫的, description: 文中插圖是我自己畫的。 }
    # photo: { group: art, icon: ri:camera-3-line, label: 自己拍的, description: 照片都是我自己拍的。 }
    # ai-art: { group: art, icon: ri:image-ai-line, label: AI 配圖, description: 文中有 AI 生成或協作繪製的圖。 }
    # ongoing: { group: status, icon: ri:refresh-line, label: 持續更新, description: 這篇會不定期補充。 }
    # wip: { group: status, icon: ri:seedling-line, label: 未完待續, description: 坑還沒填完，後面會接著寫。 }
    # late-night: { group: mood, icon: ri:moon-clear-line, label: 深夜寫的 }
    # one-sitting: { group: mood, icon: ri:cup-line, label: 一口氣寫完 }

# =============================================================================
# Post Actions
# 文章操作 - 麵包屑右側的「複製 Markdown」按鈕組
# =============================================================================
# 字段說明：
#   copyMarkdown: 複製全文 Markdown（含 frontmatter）
#   downloadMarkdown: 下載 .md 文件
#   openInEditor: 在寫作室打開，需要 editor.enabled
#     off      不顯示
#     dev      僅本地開發服務器顯示
#     everyone 所有訪客可見，訪客打開的是一份瀏覽器草稿副本，不會改動博客
# 加密文章（password）不提供原文，也不顯示這些按鈕
# -----------------------------------------------------------------------------
postActions:
  copyMarkdown: false
  downloadMarkdown: false
  openInEditor: off

# =============================================================================
# Navigation Routes
# 導航菜單配置 - 定義頂部導航欄的菜單項
# =============================================================================
# 字段說明：
#   name: 菜單項顯示名稱
#   path: 鏈接路徑（有 children 時可省略，點擊展開子菜單）
#   icon: Iconify 圖標標識，格式 "集合:圖標名"
#   children: (可選) 子菜單列表，結構與父級相同
# -----------------------------------------------------------------------------
# 圖標參考：
#   - Font Awesome 6: https://icon-sets.iconify.design/fa6-solid/
#   - Remix Icon: https://icon-sets.iconify.design/ri/
# -----------------------------------------------------------------------------
navigation:
  - name: 首頁
    nameKey: nav.home
    path: /
    icon: ri:home-heart-fill
  - name: 文章
    nameKey: nav.posts
    path: /posts
    icon: ri:quill-pen-ai-fill
  - name: 關於
    nameKey: nav.about
    path: /about
    icon: fa6-regular:circle-user
comment:
  provider: none  # 'remark42' | 'giscus' | 'waline' | 'twikoo' | 'none'
  # remark42:
  #   host: https://comment.example.com/
  #   siteId: your-site-id
  # giscus:
  #   repo: username/repo              # GitHub 倉庫名 (owner/repo 格式)
  #   repoId: R_kgDOxxxxxx             # 倉庫 ID (從 giscus.app 獲取)
  #   category: Announcements          # Discussion 分類名稱
  #   categoryId: DIC_kwDOxxxxxx       # 分類 ID (從 giscus.app 獲取)
  #   mapping: pathname                # 映射方式
  #   reactionsEnabled: '1'            # 啟用 reactions ('0' | '1')
  #   emitMetadata: '0'                # 發送元數據 ('0' | '1')
  #   inputPosition: top               # 輸入框位置 ('top' | 'bottom')
  #   lang: zh-CN                      # 語言

  # waline:
  #   serverURL: https://your-waline.vercel.app  # Waline 服務端地址 (必填)
  #   lang: zh-CN                      # 語言 (默認: 'zh-CN')
  #   dark: html.dark                  # 暗黑模式 (默認: 'html.dark')
  #                                    # 可選: true (自適應) | false (禁用) | CSS選擇器字符串
  #   meta:                            # 評論者信息字段 (默認: ['nick', 'mail', 'link'])
  #     - nick
  #     - mail
  #     - link
  #   requiredMeta:                    # 必填字段 (默認: [])
  #     - nick
  #   login: enable                    # 登錄模式 ('enable' | 'disable' | 'force', 默認: 'enable')
  #   wordLimit: 0                     # 評論字數限制 (0 = 無限制, 默認: 0)
  #                                    # 可選: 單個數字 | [min, max] 數組
  #   pageSize: 10                     # 每頁評論數 (默認: 10)
  #   imageUploader: false             # 圖片上傳功能 (默認: false)
  #   highlighter: true                # 代碼高亮 (默認: true)
  #   texRenderer: false               # LaTeX 渲染 (默認: false)
  #   search: false                    # 搜索功能 (默認: false)
  #   reaction: false                  # 文章反應功能 (默認: false)
  #                                    # 可選: true | false | 字符串數組 (自定義反應圖標)
  #   emoji: true                      # 表情包配置 (默認: ['//unpkg.com/@waline/emojis@1.2.0/weibo'])
  #                                    # 可選: true | false | 字符串/對象數組
  #                                    # 預設表情包: '//unpkg.com/@waline/emojis@1.2.0/weibo'
  #                                    #           '//unpkg.com/@waline/emojis@1.2.0/alus'
  #                                    #           '//unpkg.com/@waline/emojis@1.2.0/bilibili'
  #                                    #           '//unpkg.com/@waline/emojis@1.2.0/qq'
  #                                    #           '//unpkg.com/@waline/emojis@1.2.0/tieba'
  #                                    #           '//unpkg.com/@waline/emojis@1.2.0/tw-emoji'
  #   commentSorting: latest           # 評論排序 ('latest' | 'oldest' | 'hottest', 默認: 'latest')
  #   noCopyright: false               # 隱藏頁腳版權信息 (默認: false)
  #   comment: true                    # 評論數統計 (默認: true)
  #   pageview: true                   # 頁面訪問量統計 (默認: true)
  #   # recaptchaV3Key: ''             # reCAPTCHA v3 Key (可選)
  #   # turnstileKey: ''               # Cloudflare Turnstile Key (可選)
  #   # locale:                        # 自定義語言顯示 (可選)
  #   #   placeholder: '請留言...'      # 自定義輸入框佔位文本
  twikoo:
    envId: https://your-twikoo.vercel.app  # Twikoo 環境 ID (騰訊雲) 或 Vercel 環境地址 (必填)
    # region: ap-shanghai              # 環境地域，默認為 ap-shanghai
    # path: location.pathname          # 用於區分不同文章的自定義 js 路徑
    # lang: zh-CN                     # 語言 (默認: 'zh-CN')

# =============================================================================
# Analytics (Umami)
# =============================================================================
# id: Umami 網站 ID
# endpoint: Umami 服務器地址
# enabled: 是否啟用統計
# statistics_display: 統計信息顯示配置
#   token: Umami 分享鏈接令牌（只讀，可安全暴露到客戶端）
#   article_page_views: 在文章詳情頁顯示訪問量
#   footer_site_stats: 在頁腳 Site Stats 中顯示全站訪問量
# -----------------------------------------------------------------------------
analytics:
  umami:
    enabled: false
    id: your-umami-id
    endpoint: https://stats.example.com
    # statistics_display:
    #   token: your-umami-share-token
    #   article_page_views: true
    #   footer_site_stats: true

# =============================================================================
# SEO Configuration
# =============================================================================
# https://github.com/alextim/astro-lib/tree/main/packages/astro-robots-txt#readme
# robots: robots.txt 配置 (由 astro-robots-txt 自動生成)
#   policy: 爬蟲策略數組（可選，默認允許所有）
#     - userAgent: 爬蟲名稱，'*' 表示所有
#       allow: 允許路徑（可為字符串或數組）
#       disallow: 禁止路徑（可為字符串或數組）
#   host: 是否添加 Host 指令（可選，適用於 Yandex）
# -----------------------------------------------------------------------------
seo:
  robots:
    # policy:                          # 爬蟲策略（可選，取消註釋並配置）
    #   - userAgent: '*'
    #     allow: '/'
    #     disallow:
    #       - '/api/'
    # host: true                       # 可選：添加 Host 指令（Yandex）

